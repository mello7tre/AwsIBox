global:
  ElasticLoadBalancingV2TrustStore:
    - ListernerMutualAuthentication:
        Create: 'no'
        IBOX_OUTPUT:
          - _:
              Value: Ref(IBOX_RESNAME)
              Export: Export(IBOX_RESNAME)
        CaCertificatesBundleS3Bucket: Sub(cfg.BucketNameAppRepository)
        CaCertificatesBundleS3Key.IBOX_AUTO_PO: {}
        CaCertificatesBundleS3Key: "alb-mtls-ca/aws-alb-mtls-ca.pem"
        CaCertificatesBundleS3ObjectVersion.IBOX_AUTO_PO:
          Condition: IBOX_CURNAME
        CaCertificatesBundleS3ObjectVersion.IBOX_PCO:
          IBOX_CONDITION:
            - IBOX_CURNAME:
                get_condition('', 'not_equals', 'none', IBOX_CURNAME)
        CaCertificatesBundleS3ObjectVersion.IBOX_CODE: If(
          IBOX_CURNAME,
          get_endvalue(IBOX_CURNAME),
          Ref("AWS::NoValue"))
        CaCertificatesBundleS3ObjectVersion: 'Bg3cREbwt3TTfHQ.oseaiPy2WKk45V.u'
        Name: Sub("${AWS::StackName}-alb-mtls")
