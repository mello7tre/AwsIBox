global:
  EventsRule:
    - ASGLifecycleTerminateECSDrain:
        Description: 'EC2 Instance-terminate Lifecycle Action for ECSDraining - Invoke Lambda: ASGCompleteLifecycleECSDeregister'
        State: 'ENABLED'
        EventPattern:
          detail-type:
            - EC2 Instance-terminate Lifecycle Action
          detail:
            LifecycleHookName:
              - ecs-managed-draining-termination-hook
          source:
            - aws.autoscaling
        Targets:
          - LambdaASGCompleteLifecycleECSDeregister:
              Arn: GetAtt('LambdaASGCompleteLifecycleECSDeregister', 'Arn')
              Id: 'TargetFunction-01'
  Lambda:
    - ASGCompleteLifecycleECSDeregister:
        Architectures:
          - arm64
        Code:
          ZipFile: str(IBOX_INDEXNAME)
        Description: 'Complete ASG Lifecycle for stopped ECS Container Instances and Deregister from Cluster'
        MemorySize: 256
        Runtime: python3.13
        Timeout: 30
  LambdaPermission:
    - ASGCompleteLifecycleECSDeregisterEventsRuleASGLifecycleTerminateECSDrain:
        FunctionName: GetAtt('LambdaASGCompleteLifecycleECSDeregister', 'Arn')
        Principal: events.amazonaws.com
        SourceArn: GetAtt("EventsRuleASGLifecycleTerminateECSDrain", 'Arn')
  IAMPolicy:
    - LambdaASGCompleteLifecycleECSDeregister:
        Roles:
          - Ref('RoleLambdaASGCompleteLifecycleECSDeregister')
        PolicyDocument:
          Statement:
            - 1:
                Action:
                  - 'ecs:ListContainerInstances'
                  - 'ecs:DeregisterContainerInstance'
                  - 'autoscaling:CompleteLifecycleAction'
                Effect: Allow
                Resource: '*'
